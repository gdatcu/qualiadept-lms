<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEvo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070812"/>
      <stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="barOld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="barNew" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="20" fill="url(#bgEvo)" stroke="#2e3668" stroke-width="1.5"/>

  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">
    Cum se redistribuie timpul unui QA Automation Engineer (2026 vs. 2029)
  </text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    De la „câte scripturi ai scris săptămâna asta?” la „ce riscuri ai prevenit în release?”
  </text>

  <!-- Left Card: 2026 -->
  <rect x="40" y="84" width="420" height="248" rx="14" fill="#13182e" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="114" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">
    ⏳ Profilul Clasic (Execuție Tehnică)
  </text>

  <!-- 2026 Bars -->
  <text x="64" y="148" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Scriere scripturi UI &amp; conversie cazuri manuale</text>
  <rect x="64" y="156" width="320" height="16" rx="8" fill="url(#barOld)"/>
  <text x="394" y="169" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">50%</text>

  <text x="64" y="200" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Întreținere locatori &amp; debug teste flaky</text>
  <rect x="64" y="208" width="210" height="16" rx="8" fill="url(#barOld)"/>
  <text x="284" y="221" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">30%</text>

  <text x="64" y="252" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Strategie de testare, analiză de risc &amp; arhitectură</text>
  <rect x="64" y="260" width="96" height="16" rx="8" fill="#38bdf8"/>
  <text x="170" y="273" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">15%</text>

  <text x="64" y="304" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Evaluare AI / LLM &amp; observabilitate în producție</text>
  <rect x="64" y="312" width="36" height="10" rx="5" fill="#a855f7"/>
  <text x="110" y="321" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">5%</text>

  <!-- Right Card: 2029 -->
  <rect x="500" y="84" width="420" height="248" rx="14" fill="#171538" stroke="#818cf8" stroke-width="2"/>
  <text x="710" y="114" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">
    🚀 Profilul 2029 (Quality &amp; AI Strategist)
  </text>

  <!-- 2029 Bars -->
  <text x="524" y="148" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Strategie bazată pe risc &amp; arhitectură de calitate</text>
  <rect x="524" y="156" width="240" height="16" rx="8" fill="url(#barNew)"/>
  <text x="774" y="169" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">35%</text>

  <text x="524" y="200" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Audit &amp; Code Review pentru teste generate de agenți</text>
  <rect x="524" y="208" width="205" height="16" rx="8" fill="url(#barNew)"/>
  <text x="739" y="221" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">30%</text>

  <text x="524" y="252" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Evaluare LLM (LLM-as-a-Judge) &amp; Shift-Right în producție</text>
  <rect x="524" y="260" width="175" height="16" rx="8" fill="url(#barNew)"/>
  <text x="709" y="273" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">25%</text>

  <text x="524" y="304" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Scriere manuală de scripturi de rutină &amp; locatori</text>
  <rect x="524" y="312" width="68" height="10" rx="5" fill="url(#barOld)"/>
  <text x="602" y="321" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">10%</text>
</svg>
